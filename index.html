<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENSO Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#eef2f5;
}

header{
    background:#0b2a4a;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h3{
    text-align:center;
}

.value{
    font-size:28px;
    text-align:center;
    margin:10px 0;
    color:#0b2a4a;
    font-weight:bold;
}

.small{
    text-align:center;
    font-size:12px;
    color:#666;
}
</style>
</head>

<body>

<header>
<h1>ENSO Live Dashboard</h1>
<p>Real-time climate index (simulated live structure)</p>
</header>

<div class="container">

<div class="card">
<h3>ENSO Status (Niño 3.4)</h3>
<div class="value" id="ensoValue">Loading...</div>
<div class="small">Updated automatically</div>
</div>

<div class="card">
<h3>Ocean State</h3>
<div class="value" id="oceanState">Loading...</div>
<div class="small">Based on ENSO index</div>
</div>

<div class="card">
<h3>Atmospheric Signal</h3>
<div class="value" id="atmo">Loading...</div>
<div class="small">Walker circulation strength</div>
</div>

</div>

<script>
// simple simulated live ENSO data (we can replace with NOAA API next)
function updateENSO(){

    let value = (Math.random()*3 - 1.5).toFixed(2);

    document.getElementById("ensoValue").innerText = value;

    let state = "Neutral";

    if(value > 0.5) state = "El Niño";
    if(value < -0.5) state = "La Niña";

    document.getElementById("oceanState").innerText = state;

    document.getElementById("atmo").innerText =
        (Math.random() > 0.5 ? "Strong" : "Weak");

}

updateENSO();
setInterval(updateENSO, 5000);
</script>

</body>
</html>
