<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENSO Dashboard</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

h1{
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

img{
    width:100%;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>ENSO Dashboard</h1>

<div class="grid">

<div class="card">
<h3>ENSO Regions</h3>
<img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/ENSO_Regions.png">
</div>

<div class="card">
<h3>Walker Circulation</h3>
<img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Walker_circulation.png">
</div>

<div class="card">
<h3>Sea Surface Temperature Anomalies</h3>
<img src="https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_update/sstanim.gif">
</div>

<div class="card">
<h3>ENSO Forecast</h3>
<img src="https://iri.columbia.edu/wp-content/uploads/sites/25/2024/05/ENSO-plume.png">
</div>

</div>

</body>
</html>
