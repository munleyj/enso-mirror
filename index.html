<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ENSO Live Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .dashboard {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin: 10px;
            width: 250px;
            text-align: center;
        }
        .value {
            font-size: 2em;
            margin: 10px 0;
        }
        .small {
            font-size: 0.85em;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>ENSO Live Dashboard</h1>
    <div class="dashboard">
        <div class="card">
            <h3>ENSO Status (Niño 3.4)</h3>
            <div class="value" id="ensoValue">Loading...</div>
            <div class="small">Updated automatically</div>
        </div>

        <div class="card">
            <h3>Ocean State</h3>
            <div class="value" id="oceanState">Loading...</div>
            <div class="small">Based on ENSO index</div>
        </div>

        <div class="card">
            <h3>Atmospheric Signal</h3>
            <div class="value" id="atmo">Loading...</div>
            <div class="small">Walker circulation strength</div>
        </div>
    </div>

    <script>
        async function updateENSO() {
            try {
                const res = await fetch("/api/enso");
                const data = await res.json();

                const oni = data.oni;

                // Update ENSO value
                document.getElementById("ensoValue").innerText = oni.toFixed(2);

                // Determine Ocean State
                let state = "Neutral";
                if (oni >= 0.5) state = "El Niño";
                if (oni <= -0.5) state = "La Niña";
                document.getElementById("oceanState").innerText = state;

                // Determine Atmospheric Signal
                document.getElementById("atmo").innerText =
                    oni > 0
                        ? "Weakened Walker Circulation"
                        : "Strengthened Walker Circulation";

            } catch (e) {
                // If API fails
                document.getElementById("ensoValue").innerText = "No Data";
                document.getElementById("oceanState").innerText = "Error loading API";
                document.getElementById("atmo").innerText = "N/A";
            }
        }

        // Initial load
        updateENSO();

        // Update every hour
        setInterval(updateENSO, 3600000);
    </script>
</body>
</html>
