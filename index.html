<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ENSO Dashboard</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#eef2f5;
}

header{
    background:#0b2a4a;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h3{
    text-align:center;
}

img{
    width:100%;
    border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>ENSO Dashboard</h1>
<p>Climate Monitoring Overview</p>
</header>

<div class="container">

<div class="card">
<h3>ENSO Regions</h3>
<div style="height:200px; background:#d9e2ec; display:flex; align-items:center; justify-content:center; border-radius:8px;">
ENSO Regions Diagram
</div>
</div>

<div class="card">
<h3>Walker Circulation</h3>
<div style="height:200px; background:#d9e2ec; display:flex; align-items:center; justify-content:center; border-radius:8px;">
Walker Circulation Diagram
</div>
</div>

<div class="card">
<h3>Sea Surface Temperature</h3>
<div style="height:200px; background:#d9e2ec; display:flex; align-items:center; justify-content:center; border-radius:8px;">
SST Anomalies
</div>
</div>

<div class="card">
<h3>ENSO Cycle</h3>
<div style="height:200px; background:#d9e2ec; display:flex; align-items:center; justify-content:center; border-radius:8px;">
ENSO Cycle Diagram
</div>


</div>

</body>
</html>
