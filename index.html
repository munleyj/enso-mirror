<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENSO Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef2f5;
}

header{
    background:#0b2a4a;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h3{
    text-align:center;
}

img{
    width:100%;
    border-radius:8px;
}

.note{
    font-size:12px;
    text-align:center;
    color:#666;
}
</style>
</head>

<body>

<header>
<h1>ENSO Dashboard</h1>
<p>Climate Monitoring Overview</p>
</header>

<div class="container">

<div class="card">
<h3>ENSO Regions</h3>
<img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/ENSO_Regions.png">
</div>

<div class="card">
<h3>Walker Circulation</h3>
<img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Walker_circulation.png">
</div>

<div class="card">
<h3>Sea Surface Temperature</h3>
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Sea_surface_temperature_anomaly.png">
</div>

<div class="card">
<h3>ENSO Cycle (Safe Diagram)</h3>
<img src="https://upload.wikimedia.org/wikipedia/commons/5/50/El_Ni%C3%B1o_La_Ni%C3%B1a_graph.svg">
<div class="note">Stable ENSO cycle diagram</div>
</div>

</div>

</body>
</html>
